name: ci

# CI de la casa: nada se promete que no se corra. Cinco trabajos:
#   calidad  → lint + typecheck + los 18 tests del motor + build
#   e2e      → páginas y API contra el servidor real, Firefox y Chromium
#   sql      → el camino PostGIS con un PostGIS 18 de verdad + la carrera
#   nix      → el flake: `nix flake check` + humo del servidor que nix construye
#   pages    → en main: generate estático y deploy a GitHub Pages
#
# Los trabajos sql y nix usan el MISMO flake y los MISMOS scripts que un
# humano en local (`nix develop` + sql/pg.sh + sql/comprobar.sh): no hay
# una versión de CI de la verdad y otra doméstica.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "preparar (genera .nuxt: tipos y el config de ESLint)"
        run: pnpm exec nuxi prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-nitro
          path: .output
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-reporte
          path: playwright-report
          retention-days: 7

  sql:
    # El camino de producción contra un PostGIS REAL: el mismo binario que
    # trae el dev shell del flake, el mismo script de aceptación que corre
    # un humano. Sin Docker — sin capa de indirección entre local y CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: PostGIS 18 desde el flake (arrancar + sembrar)
        run: nix develop -c sql/pg.sh start
      - name: los dos escenarios del encargo, Luanda y la carrera (100 veces)
        env:
          DATABASE_URL: postgresql://nitheky:nitheky@127.0.0.1:5432/nitheky
        run: nix develop -c sql/comprobar.sh
      - name: parar
        if: always()
        run: nix develop -c sql/pg.sh stop || true

  nix:
    # El flake verificándose a sí mismo: `nix flake check` construye el
    # paquete del servidor Nitro Y corre los 18 tests del motor DENTRO del
    # sandbox; después, el servidor que nix construye se enciende de verdad.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check
      - name: humo del servidor construido por nix
        run: |
          nix build .#nitheky-web
          PORT=4197 result/bin/nitheky-web &
          PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4197/api/salud > /tmp/salud.json && break
            sleep 1
          done
          grep -q '"ok":true' /tmp/salud.json
          curl -sf -o /dev/null http://127.0.0.1:4197/requisitos
          kill "$PID"
          echo "✔ el servidor que nix construye sirve páginas y API"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [calidad, e2e, sql, nix]
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: generate estático (con la base /nitheky-proof/)
        run: NUXT_APP_BASE_URL=/nitheky-proof/ pnpm generate
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: despliegue
        uses: actions/deploy-pages@v4
